# Параметры заходов (moonglide/approaches.py). Скопировать в approaches.local.toml (он в .gitignore)
# и вписать цифры из схем захода своей страны — AIP многих стран распространять нельзя.
# Расстояния — от порога; если на схеме DME от маяка VOR, пересчитать до порога.

[XXXX."09"]
angle = 3.0       # угол глиссады, °
tch_ft = 50       # высота пролёта порога, футы
faf_nm = 5.0      # FAF — начало снижения по глиссаде
if_nm = 10.0      # IF — начало прямого участка; от IF до FAF — горизонтально на высоте FAF
note = "ILS RWY 09"
